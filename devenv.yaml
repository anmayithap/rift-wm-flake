---
# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  import-tree:
    url: github:denful/import-tree?ref=latest
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  treefmt-nix:
    url: github:numtide/treefmt-nix?ref=main
    inputs:
      nixpkgs:
        follows: nixpkgs
secretspec:
  enable: true
  profile: default
  provider: sops
  cachix_auth_token: true
